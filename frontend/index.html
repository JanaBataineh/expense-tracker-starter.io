<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="container mt-5">

    <nav class="navbar navbar-light bg-light mb-4 px-3 rounded">
      <span class="navbar-brand mb-0 h1">Expenses Report</span>
    </nav>

    <!-- Alerts -->
    <div id="alert-container"></div>

    <!-- Loading spinner -->
    <div id="loading-spinner" class="text-center d-none mb-4">
      <div class="spinner-border text-dark" role="status"></div>
      <p>Loading...</p>
    </div>

    <!-- Summary cards -->
    <div class="summary-grid">
      <div class="card text-center">
        <div class="card-body">
          <h5 class="card-title">Total Spent</h5>
          <h3 class="card-text"><span id="total-amount">0.00</span></h3>
        </div>
      </div>
      <div class="card text-center">
        <div class="card-body">
          <h5 class="card-title">Expenses</h5>
          <h3 class="card-text" id="expense-count">0</h3>
        </div>
      </div>
      <div class="card text-center bg-danger">
        <div class="card-body">
          <h5 class="card-title">Highest Expense</h5>
          <h3 class="card-text"><span id="highest-expense">0.00</span></h3>
        </div>
      </div>
    </div>

    <!-- Add form -->
    <div class="card mb-4">
      <div class="card-body">
        <h5 class="card-title mb-3">Add a New Expense</h5>
        <form id="add-expense-form">
          <div class="row">
            <div class="col-md-3 mb-3">
              <input type="text" id="title" class="form-control" placeholder="Title (e.g., Lunch)" required maxlength="100">
            </div>
            <div class="col-md-2 mb-3">
              <input type="number" id="amount" class="form-control" placeholder="Amount" step="0.01" min="0.01" required>
            </div>
            <div class="col-md-3 mb-3">
              <select id="category" class="form-select" required>
                <option value="" disabled selected>Choose a category...</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="col-md-2 mb-3">
              <input type="date" id="date" class="form-control" required>
            </div>
            <div class="col-md-2 mb-3">
              <button type="submit" class="btn btn-primary w-100">Add</button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <!-- Expenses table -->
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Expense List</h5>

        <div class="row mb-3">
          <div class="col-md-4">
            <select id="category-filter" class="form-select border-primary">
              <option value="All" selected>All Categories</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table mt-3">
            <thead>
              <tr>
                <th>Title</th>
                <th>Amount</th>
                <th>Category</th>
                <th>Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="expense-list"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit modal -->
  <div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit Expense</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="edit-alert-container"></div>
          <form id="edit-expense-form">
            <input type="hidden" id="edit-id">
            <div class="mb-3">
              <label for="edit-title">Title</label>
              <input type="text" id="edit-title" class="form-control" required maxlength="100">
            </div>
            <div class="mb-3">
              <label for="edit-amount">Amount</label>
              <input type="number" id="edit-amount" class="form-control" step="0.01" min="0.01" required>
            </div>
            <div class="mb-3">
              <label for="edit-category">Category</label>
              <select id="edit-category" class="form-select" required>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="edit-date">Date</label>
              <input type="date" id="edit-date" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-warning w-100">Save Changes</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
